<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explorer</title>
<style>
  /* Lightbox theme: a pale film-base page, flat sheets, and diagrams shown as backlit film. */
  :root {
    color-scheme: light;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: Bahnschrift, "DIN Alternate", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --bg: #e6edf1; --panel: #f8fbfc; --ink: #0c2130; --muted: #51687a; --line: #bccbd5;
    --accent: #0b5f82; --accent-soft: #d3e6ef; --on-accent: #ffffff;
    --ok: #1f7a55; --warn: #94570a; --bad: #b3263e;
    --shadow: 0 12px 40px rgba(8, 20, 28, .28);
    /* The backlit film used inside every diagram, in both themes. */
    --lb-bg: #08141c; --lb-panel: #0f2431; --lb-ink: #e8f1f6; --lb-muted: #8da7b8; --lb-line: #284558;
    --lb-accent: #ffcf66; --lb-soft: #1d3d50; --lb-ok: #4cc795; --lb-warn: #e5a955;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0a151d; --panel: #101f2a; --ink: #e3eef4; --muted: #8aa3b4; --line: #24394a;
      --accent: #6cc3de; --accent-soft: #14323f; --on-accent: #04202c;
      --ok: #4cc795; --warn: #e5a955; --bad: #ef7586;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0a151d; --panel: #101f2a; --ink: #e3eef4; --muted: #8aa3b4; --line: #24394a;
    --accent: #6cc3de; --accent-soft: #14323f; --on-accent: #04202c;
    --ok: #4cc795; --warn: #e5a955; --bad: #ef7586;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink); font: 14.5px/1.55 var(--sans); overflow-x: hidden;
    display: grid; grid-template-columns: 14.5rem minmax(0, 1fr); column-gap: 32px; align-content: start;
    max-width: 1440px; margin: 0 auto; padding: 0 24px 56px;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  code, .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 12.5px; overflow-wrap: break-word; }
  .muted { color: var(--muted); }
  .hint { font-size: 12.5px; color: var(--muted); margin: 6px 0; }
  h1 { font: 700 30px/1.15 var(--serif); letter-spacing: -.01em; margin: 0; }
  h2 { font: 600 22px/1.25 var(--serif); margin: 0 0 10px; }
  h3 { font: 600 15px/1.35 var(--sans); margin: 20px 0 6px; color: var(--ink); }
  p { margin: 8px 0; }
  ul { margin: 8px 0; padding-left: 20px; }
  li { margin: 4px 0; overflow-wrap: anywhere; }
  .card p, .card li, .callout { max-width: 70ch; }

  header { grid-column: 1 / -1; grid-row: 1; padding: 30px 0 22px; margin-bottom: 24px; border-bottom: 1px solid var(--line); display: flex; gap: 16px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 10px; display: flex; flex-wrap: wrap; gap: 2px 22px; }
  .meta-part { overflow-wrap: anywhere; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; }
  .btn:hover { border-color: var(--accent); }
  .btn[aria-pressed="true"], .btn.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  kbd { font: 11px ui-monospace, Consolas, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-left: 8px; color: var(--muted); }

  nav { grid-column: 1; grid-row: 2; align-self: start; position: sticky; top: 20px; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; max-height: calc(100vh - 40px); overflow-y: auto; }
  nav button { background: transparent; border: 0; border-left: 3px solid transparent; border-radius: 0 6px 6px 0; padding: 8px 12px; text-align: left; line-height: 1.35; color: var(--muted); }
  nav button:hover { background: var(--accent-soft); color: var(--ink); }
  nav button[aria-selected="true"] { background: var(--panel); border-left-color: var(--accent); color: var(--ink); font-weight: 600; }
  main { grid-column: 2; grid-row: 2; margin: 0; padding: 0; min-width: 0; }
  section.view { display: none; }
  section.view.active { display: block; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 20px 22px; min-width: 0; }
  .card + .card { margin-top: 18px; }
  .split { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 18px; align-items: start; }
  .split > .card + .card { margin-top: 0; }
  /* The inspector (the second column) carries an accent edge so it reads as a different kind of sheet. */
  .split:not(.mapright) > .card:last-child { border-left: 3px solid var(--accent); }
  .split.wide { grid-template-columns: minmax(0, 2.2fr) minmax(0, 1fr); }
  .split.mapright { grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 1180px) { .split.mapright { grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); } }
  /* The detail panel stays in view while the user scrolls a tall diagram or table. */
  .split.wide > :last-child { position: sticky; top: 16px; max-height: calc(100vh - 32px); overflow-y: auto; }
  @media (max-width: 900px) {
    body { grid-template-columns: minmax(0, 1fr); padding: 0 16px 40px; }
    header { padding: 22px 0 16px; margin-bottom: 14px; }
    nav { grid-column: 1; grid-row: auto; position: static; flex-direction: row; gap: 4px; max-height: none; overflow-x: auto; overflow-y: hidden; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
    nav button { flex: none; white-space: nowrap; border-left: 0; border-bottom: 3px solid transparent; border-radius: 6px 6px 0 0; }
    nav button[aria-selected="true"] { border-left-color: transparent; border-bottom-color: var(--accent); }
    main { grid-column: 1; grid-row: auto; }
    .split, .split.wide, .split.mapright { grid-template-columns: minmax(0, 1fr); }
    .split > .card + .card { margin-top: 18px; }
    .split.wide > :last-child { position: static; max-height: none; }
    .card { padding: 16px; }
  }
  .chip { display: inline-block; padding: 2px 9px; border-radius: 4px; font-size: 12.5px; border: 1px solid var(--line); background: var(--panel); margin: 2px 4px 2px 0; }
  button.chip { cursor: pointer; text-align: left; }
  button.chip:hover { border-color: var(--accent); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .chip.link { border-color: var(--accent); color: var(--accent); }
  .chip-ctx { margin-left: 6px; color: var(--muted); font-size: 11.5px; }
  .chip.sev-high { border-color: var(--bad); color: var(--bad); font-weight: 600; }
  .chip.sev-med { border-color: var(--warn); color: var(--warn); font-weight: 600; }
  .chip.sev-low { border-color: var(--ok); color: var(--ok); font-weight: 600; }
  .chip.on.sev-high, .chip.on.sev-med, .chip.on.sev-low { color: #fff; }
  .chip.on.sev-high { background: var(--bad); border-color: var(--bad); }
  .chip.on.sev-med { background: var(--warn); border-color: var(--warn); }
  .chip.on.sev-low { background: var(--ok); border-color: var(--ok); }
  .chip.unverified { border-style: dashed; color: var(--warn); border-color: var(--warn); }
  .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  input[type="search"], select { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; }
  input[type="search"] { width: 100%; }
  .row-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
  .grow { flex: 1 1 160px; min-width: 0; }
  .callout { border-left: 4px solid var(--warn); background: var(--accent-soft); padding: 10px 14px; border-radius: 4px; margin: 12px 0; }
  dl.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; margin: 8px 0; }
  dl.kv dt { color: var(--muted); } dl.kv dd { margin: 0; overflow-wrap: anywhere; }

  /* SVG viewport shared by map and state graph: backlit film, the same in light and dark themes. */
  .viewport {
    --bg: var(--lb-bg); --panel: var(--lb-panel); --ink: var(--lb-ink); --muted: var(--lb-muted); --line: var(--lb-line);
    --accent: var(--lb-accent); --accent-soft: var(--lb-soft); --ok: var(--lb-ok); --warn: var(--lb-warn);
    position: relative; border: 1px solid var(--lb-line); border-radius: 8px; background: var(--lb-bg); color: var(--lb-ink); overflow: hidden;
  }
  /* The inline aspect-ratio (set from the diagram bounds) sizes the height; max-height only caps very tall diagrams. */
  .viewport svg { display: block; width: 100%; height: auto; min-height: 200px; max-height: min(78vh, 780px); cursor: grab; touch-action: pan-y pinch-zoom; user-select: none; }
  .viewport.compact svg { max-height: min(54vh, 480px); }
  .viewport.tall svg { max-height: min(86vh, 880px); }
  .viewport svg.panning { cursor: grabbing; }
  .zoombar { position: absolute; top: 8px; right: 8px; display: flex; flex-direction: column; gap: 4px; }
  .zoombar button { width: 30px; height: 30px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); line-height: 1; }
  .zoombar button:hover { border-color: var(--accent); }
  .tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 4px; padding: 4px 8px; font-size: 12px; max-width: 260px; z-index: 5; display: none; }
  .node { cursor: pointer; transition: opacity .15s; }
  .node rect { fill: var(--panel); stroke-width: 1.6; }
  .node.ext rect { stroke-dasharray: 5 3; }
  .node text { fill: var(--ink); pointer-events: none; }
  .node .t { font-size: 12px; font-weight: 600; } .node .s { font-size: 10.5px; fill: var(--muted); }
  .node.sel rect, .node.hl rect, .node.cur rect { fill: var(--accent-soft); stroke-width: 2.8; }
  .node.path rect { fill: var(--accent-soft); stroke-width: 2.8; stroke-dasharray: none; }
  .node.dim, .edge-g.dim, .st.dim { opacity: .26; }
  .node.flash rect, .st.flash rect { animation: pulse 1.2s ease-out 1; }
  @keyframes pulse { 0% { stroke-width: 7; } 100% { stroke-width: 1.6; } }
  .cont { fill: none; stroke: var(--line); stroke-width: 1.2; stroke-dasharray: 2 4; }
  .cont-label { fill: var(--muted); font-size: 11px; }
  .edge { fill: none; stroke: var(--muted); stroke-width: 1.3; opacity: .6; }
  .edge-g.hl .edge, .edge-g.path .edge { stroke: var(--accent); stroke-width: 2.4; opacity: 1; }
  .elabel { fill: var(--muted); font-size: 10px; paint-order: stroke; stroke: var(--bg); stroke-width: 3px; }
  .edge-g.hl .elabel, .edge-g.path .elabel { fill: var(--accent); }
  .dot { fill: var(--accent); }
  .st { cursor: pointer; transition: opacity .15s; }
  .st rect { fill: var(--panel); stroke: var(--muted); stroke-width: 1.4; }
  .st.initial rect { stroke: var(--ok); stroke-width: 2; }
  .st.terminal rect { stroke-dasharray: 4 2; }
  .st text { fill: var(--ink); font: 11px ui-monospace, Consolas, monospace; pointer-events: none; }
  .st.sel rect, .st.cur rect { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2.6; }
  .st .badge { fill: var(--warn); font-size: 10px; font-weight: 700; }
  .tr { fill: none; stroke: var(--muted); stroke-width: 1.3; opacity: .65; cursor: pointer; }
  .tr.hl { stroke: var(--accent); stroke-width: 2.4; opacity: 1; }
  .tr.trail { stroke: var(--ok); stroke-width: 2.6; opacity: 1; }
  .tr.dim { opacity: .08; }

  .lanes { display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); gap: 8px; margin: 12px 0; }
  .lane { border: 2px solid var(--line); border-radius: 8px; padding: 8px 4px; font-size: 13px; text-align: center; opacity: .4; transition: opacity .15s; min-width: 0; }
  .lane.on { opacity: 1; background: var(--accent-soft); }
  .lane b { display: block; overflow-wrap: normal; }
  .stepbar { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0; }
  .stepbar button { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); font-variant-numeric: tabular-nums; }
  .stepbar button:hover { border-color: var(--accent); }
  .stepbar button.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

  .tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  td.mono { white-space: nowrap; }
  th { color: var(--muted); font-size: 12.5px; font-weight: 600; white-space: nowrap; }
  th button { background: none; border: 0; padding: 0; color: inherit; font: inherit; }
  tbody tr[data-key] { cursor: pointer; }
  tbody tr[data-key]:hover, tbody tr.sel { background: var(--accent-soft); }
  tr.groupbar td { background: var(--bg); font-weight: 600; cursor: pointer; }
  tr.flash, .flashable.flash { animation: flashbg 1.2s ease-out 1; }
  @keyframes flashbg { 0% { background: var(--accent-soft); outline: 2px solid var(--accent); } 100% { outline: 2px solid transparent; } }

  .barrow { display: grid; grid-template-columns: minmax(120px, 280px) minmax(0, 1fr) 80px; gap: 10px; align-items: center; margin: 6px 0; }
  @media (max-width: 640px) { .barrow { grid-template-columns: minmax(0, 1fr) 70px; } .barrow .barwrap { grid-column: 1 / -1; order: 3; } }
  .bar { height: 12px; border-radius: 2px; min-width: 2px; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  details.note { border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; margin: 8px 0; background: var(--panel); }
  details.note summary { cursor: pointer; font-weight: 600; }

  .overlay { position: fixed; inset: 0; background: rgba(6, 14, 20, .55); display: flex; align-items: flex-start; justify-content: center; padding: 10vh 16px 16px; z-index: 50; }
  .overlay[hidden] { display: none; }
  .pal { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; width: min(640px, 100%); box-shadow: var(--shadow); padding: 12px; }
  .pal ul { list-style: none; margin: 8px 0 0; padding: 0; max-height: 50vh; overflow-y: auto; }
  .pal li { padding: 7px 10px; border-radius: 6px; cursor: pointer; display: flex; gap: 8px; justify-content: space-between; margin: 0; max-width: none; }
  .pal li[aria-selected="true"] { background: var(--accent-soft); }
  .pal .kind { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 6px 14px; border-radius: 6px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 60; }
  #toast.show { opacity: 1; }
  @media print {
    header .tools, nav, .zoombar, .row-tools, .stepbar, .flowctl, #toast, .overlay { display: none !important; }
    html, body { background: #fff; }
    body { display: block; padding: 0; }
    section.view { display: block !important; page-break-after: always; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <div>
    <h1 id="app-title"></h1>
    <div class="sub" id="app-sub"></div>
  </div>
  <div class="tools" id="app-tools"></div>
</header>
<nav id="tabs" role="tablist"></nav>
<main id="views"></main>
<div id="toast" role="status" aria-live="polite"></div>
<pre id="selftest-result" hidden></pre>
<script type="application/json" id="data">/*__DATA__*/</script>

    }
  };
  const LANG = (DATA.meta && DATA.meta.lang) || 'en';
  const UI = Object.assign({}, STRINGS.en, STRINGS[LANG] || {}, DATA.ui || {});
  const tr = (key, vars) => String(UI[key] !== undefined ? UI[key] : key)
    .replace(/\{(\w+)\}/g, (_, k) => (vars && vars[k] !== undefined ? vars[k] : ''));

  const el = (tag, attrs, ...kids) => build(document.createElement(tag), attrs, kids);

  const store = {
    key: (k) => 'cwp:' + ((DATA.meta && DATA.meta.title) || 'page') + ':' + k,
    get(k) { try { return localStorage.getItem(this.key(k)); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(this.key(k), v); } catch (e) { /* storage may be blocked */ } }

  let toastTimer = 0;
  function toast(message) {

  function copyText(text, message) {

    if (line) lines.push(line);

  /** Point where a ray from inside rect `r` (origin `o`, direction `d`) leaves the rect. */
  function rectExit(o, d, r) {

    if (d.x > 0) t = Math.min(t, (r.x + r.w - o.x) / d.x); else if (d.x < 0) t = Math.min(t, (r.x - o.x) / d.x);

    if (!Number.isFinite(t) || t < 0) t = 0;
    return { x: o.x + d.x * t, y: o.y + d.y * t };
  }

  /** Straight line between two node borders, shifted sideways by `shift` so parallel edges do not overlap. */
  function edgeGeometry(a, b, shift) {
    const ca = { x: a.x + a.w / 2, y: a.y + a.h / 2 };
    const cb = { x: b.x + b.w / 2, y: b.y + b.h / 2 };
    const dx = cb.x - ca.x, dy = cb.y - ca.y;
    const len = Math.hypot(dx, dy) || 1;
    const d = { x: dx / len, y: dy / len };
    const p = { x: -d.y, y: d.x };
    const o1 = { x: ca.x + p.x * shift, y: ca.y + p.y * shift };
    const o2 = { x: cb.x + p.x * shift, y: cb.y + p.y * shift };
    const p1 = rectExit(o1, d, a);
    const p2 = rectExit(o2, { x: -d.x, y: -d.y }, b);
    const gap = 3; // keeps the arrow head clear of the border stroke
    const end = { x: p2.x - d.x * gap, y: p2.y - d.y * gap };
    return { d: 'M' + p1.x + ',' + p1.y + ' L' + end.x + ',' + end.y, mid: { x: (p1.x + end.x) / 2, y: (p1.y + end.y) / 2 }, normal: p };
  }

  /* ===================================================================
   * Index of every addressable entity (palette search, cross-links, deep links)
   * =================================================================== */
  const viewById = new Map(DATA.views.map((v) => [v.id, v]));
  const keyOf = (view, id) => view + '/' + id;
  const INDEX = [];
  const entryByKey = new Map();

  function addEntry(view, id, label, text) {
    const entry = { key: keyOf(view.id, id), view: view.id, id: String(id), label: String(label), text: String(text || ''), kind: view.title };
    INDEX.push(entry);
    entryByKey.set(entry.key, entry);
  }
  const rowId = (row, i) => (row.id !== undefined ? String(row.id) : 'row-' + i);

  function buildIndex() {
    for (const view of DATA.views) {
      if (view.type === 'map') view.nodes.forEach((n) => addEntry(view, n.id, n.title, [n.sub, n.summary, n.size].join(' ')));
      else if (view.type === 'flow') view.steps.forEach((s, i) => addEntry(view, s.id, (i + 1) + '. ' + s.title, s.text));
      else if (view.type === 'states') view.states.forEach((s) => addEntry(view, s.id, s.label || s.id, s.description));
      else if (view.type === 'catalog') view.rows.forEach((r, i) => addEntry(view, rowId(r, i), String(r[view.columns[0].key] ?? rowId(r, i)), view.columns.map((c) => r[c.key]).join(' ')));
      else if (view.type === 'metrics') view.series.forEach((s) => addEntry(view, s.id, s.title, s.items.map((i) => i.label).join(' ')));
      else if (view.type === 'notes') view.items.forEach((n) => addEntry(view, n.id, n.title, n.text));
    }
  }

  /** Chips that jump to another view/item; the label comes from the target when it can be resolved. */
  function linkChips(links) {
    if (!links || !links.length) return null;
    return el('div', { class: 'links' }, links.map((l) => {
      const entry = l.id !== undefined ? entryByKey.get(keyOf(l.view, l.id)) : null;
      const target = viewById.get(l.view);
      const label = entry ? entry.label : (target ? target.title : l.view);
      return el('button', { type: 'button', class: 'chip link', title: target ? target.title : '', onclick: () => navigate(l.view, l.id) },
        label, entry && target ? el('span', { class: 'chip-ctx' }, ' ' + target.title) : null);
    }));
  }

  /** Briefly highlights the element carrying `data-key`, scrolling it into view when it is in the page flow. */
  function flash(key) {
    const node = $$('[data-key]').find((n) => n.dataset.key === key);
    if (!node) return;
    node.classList.remove('flash');
    void node.getBoundingClientRect(); // restart the CSS animation
    node.classList.add('flash');
    if (!(node instanceof SVGElement) && node.scrollIntoView) node.scrollIntoView({ block: 'nearest' });
    setTimeout(() => node.classList.remove('flash'), 1300);
  }

  /* ===================================================================
   * Pan / zoom viewport shared by the map and the state graph
   * =================================================================== */
  function attachViewport(svg, wrap, getBounds) {
    const vp = { x: 0, y: 0, w: 100, h: 100, base: 100, fitted: false, dragged: false };
    const b0 = getBounds();
    svg.style.aspectRatio = (b0.w + 48) + ' / ' + (b0.h + 48);
    const apply = () => svg.setAttribute('viewBox', [vp.x, vp.y, vp.w, vp.h].join(' '));

    // The viewBox always keeps the element's aspect ratio, so screen/SVG conversion is one scale factor.
    function fit() {
      const r = svg.getBoundingClientRect();
      if (!r.width || !r.height) { vp.fitted = false; return false; }
      const b = getBounds();
      const pad = 24;
      let w = b.w + pad * 2, h = b.h + pad * 2;
      const aspect = r.width / r.height;
      if (w / h < aspect) w = h * aspect; else h = w / aspect;
      Object.assign(vp, { w, h, base: w, x: b.x + b.w / 2 - w / 2, y: b.y + b.h / 2 - h / 2, fitted: true });
      apply();
      return true;
    }
    function zoom(factor, cx, cy) {
      if (!vp.fitted && !fit()) return;
      const r = svg.getBoundingClientRect();
      const px = cx === undefined ? r.left + r.width / 2 : cx;
      const py = cy === undefined ? r.top + r.height / 2 : cy;
      const s = vp.w / r.width;
      const p = { x: vp.x + (px - r.left) * s, y: vp.y + (py - r.top) * s };
      const nw = clamp(vp.w / factor, vp.base / 8, vp.base * 6);
      const k = nw / vp.w;
      vp.x = p.x - (p.x - vp.x) * k;
      vp.y = p.y - (p.y - vp.y) * k;
      vp.h *= k;
      vp.w = nw;
      apply();
    }

    let drag = null;
    svg.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      drag = { x: e.clientX, y: e.clientY, vx: vp.x, vy: vp.y, moved: false, id: e.pointerId };
    });
    svg.addEventListener('pointermove', (e) => {
      if (!drag) return;
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (!drag.moved) {
        if (Math.hypot(dx, dy) < 4) return; // below the threshold it is still a click

        svg.classList.add('panning');
        try { svg.setPointerCapture(drag.id); } catch (err) { /* capture is optional */ }
      }

      vp.x = drag.vx - dx * s;
      vp.y = drag.vy - dy * s;
      apply();
    });

      if (drag && drag.moved) { vp.dragged = true; sleep0(() => { vp.dragged = false; }); }

      svg.classList.remove('panning');
    };

    svg.addEventListener('pointercancel', endDrag);

    }, { passive: false });

    const bar = el('div', { class: 'zoombar' },
      el('button', { type: 'button', 'aria-label': tr('zoomIn'), title: tr('zoomIn'), 'data-act': 'zoom-in', onclick: () => zoom(1.3) }, '+'),
      el('button', { type: 'button', 'aria-label': tr('zoomOut'), title: tr('zoomOut'), 'data-act': 'zoom-out', onclick: () => zoom(1 / 1.3) }, '−'),
      el('button', { type: 'button', 'aria-label': tr('fit'), title: tr('fit'), 'data-act': 'fit', onclick: () => fit() }, '▣'));
    wrap.append(bar);

    // Fit as soon as the element has a size (it has none while its tab is hidden) and again on resize.
    if (window.ResizeObserver) {
      let lastW = 0;
      new ResizeObserver(() => {
        const w = Math.round(svg.getBoundingClientRect().width);
        if (w && (!vp.fitted || w !== lastW)) { lastW = w; fit(); }
      }).observe(svg);
    }
    return { fit, zoom, vp, isDragging: () => vp.dragged, viewBox: () => svg.getAttribute('viewBox') };
  }

  /** Floating tooltip inside a positioned wrapper. */
  function makeTooltip(wrap) {
    const tip = el('div', { class: 'tip', role: 'tooltip' });
    wrap.append(tip);
    return {
      show(text, evt) {
        const r = wrap.getBoundingClientRect();
        tip.textContent = text;
        tip.style.display = 'block';
        tip.style.left = clamp(evt.clientX - r.left + 12, 0, Math.max(0, r.width - 180)) + 'px';
        tip.style.top = (evt.clientY - r.top + 14) + 'px';
      },
      hide() { tip.style.display = 'none'; }
    };
  }

  /* ===================================================================
   * Map widget: nodes, auto-routed edges, selection, path trace, animation
   * =================================================================== */
  let uid = 0;
  function createMapWidget(view, opts) {
    const id = ++uid;
    const nodes = new Map(view.nodes.map((n) => [n.id, n]));
    const groups = new Map((view.groups || []).map((g) => [g.id, g]));
    const edges = view.edges || [];
    const svg = sv('svg', { 'aria-label': view.title, preserveAspectRatio: 'xMidYMid meet', viewBox: '0 0 100 100' });
    const wrap = el('div', { class: cls('viewport', opts.compact && 'compact') }, svg);
    const tooltip = makeTooltip(wrap);

    const marker = (name, color) => sv('marker', { id: name + '-' + id, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto' },
      sv('path', { d: 'M0,0 L10,5 L0,10 z', fill: color }));
    svg.append(sv('defs', {}, marker('arr', 'var(--muted)'), marker('arrhl', 'var(--accent)')));

    for (const c of view.containers || []) {
      svg.append(sv('rect', { class: 'cont', x: c.x, y: c.y, width: c.w, height: c.h, rx: 12 }),
        sv('text', { class: 'cont-label', x: c.x + 10, y: c.y + 18 }, c.label));
    }

    // Edges sharing a node pair are spread sideways so opposite directions stay distinguishable.
    const pairs = new Map();
    for (const e of edges) {
      const k = [e.from, e.to].sort().join('|');
      if (!pairs.has(k)) pairs.set(k, []);
      pairs.get(k).push(e);
    }
    const edgeEls = new Map();
    const edgeLayer = sv('g', {});
    for (const e of edges) {
      const list = pairs.get([e.from, e.to].sort().join('|'));
      const sign = e.from < e.to ? 1 : -1;
      const shift = (list.indexOf(e) - (list.length - 1) / 2) * 18 * sign;
      const geo = edgeGeometry(nodes.get(e.from), nodes.get(e.to), shift);
      const d = e.path || geo.d;
      const lx = e.lx !== undefined ? e.lx : geo.mid.x + geo.normal.x * 8;
      const ly = e.ly !== undefined ? e.ly : geo.mid.y + geo.normal.y * 8 - 2;
      const path = sv('path', { class: 'edge', d, 'marker-end': 'url(#arr-' + id + ')' });
      const g = sv('g', { class: 'edge-g', 'data-edge': e.id }, path, e.label ? sv('text', { class: 'elabel', x: lx, y: ly, 'text-anchor': 'middle' }, e.label) : null);
      edgeLayer.append(g);
      edgeEls.set(e.id, { g, path, d, edge: e });
    }
    svg.append(edgeLayer);

    const nodeEls = new Map();
    const nodeLayer = sv('g', {});
    for (const n of view.nodes) {
      const color = (groups.get(n.group) || {}).color || 'var(--muted)';
      const maxChars = Math.max(6, Math.floor((n.w - 18) / 6.6));
      const lines = Math.max(1, Math.floor((n.h - 12) / 14));
      const titleLines = wrapText(n.title, maxChars, Math.min(2, lines));
      const subLines = n.sub ? wrapText(n.sub, Math.floor((n.w - 18) / 6), Math.max(0, Math.min(2, lines - titleLines.length))) : [];
      const rect = sv('rect', { x: n.x, y: n.y, width: n.w, height: n.h, rx: 9 });
      rect.style.stroke = color;
      const g = sv('g', { class: cls('node', n.external && 'ext'), 'data-id': n.id, 'data-key': keyOf(view.id, n.id), tabindex: 0, role: 'button', 'aria-label': n.title },
        sv('title', {}, n.title + (n.sub ? ' — ' + n.sub : '')), rect,
        titleLines.map((t, i) => sv('text', { class: 't', x: n.x + 10, y: n.y + 20 + i * 14 }, t)),
        subLines.map((t, i) => sv('text', { class: 's', x: n.x + 10, y: n.y + 20 + titleLines.length * 14 + 2 + i * 12.5 }, t)));
      g.addEventListener('click', () => { if (!viewport.isDragging()) opts.onNodeClick(n.id); });
      g.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); opts.onNodeClick(n.id); } });
      g.addEventListener('pointerenter', (ev) => tooltip.show(n.title + (n.sub ? ' — ' + n.sub : ''), ev));
      g.addEventListener('pointerleave', () => tooltip.hide());
      nodeLayer.append(g);
      nodeEls.set(n.id, g);
    }
    svg.append(nodeLayer);
    const dotLayer = sv('g', {});
    svg.append(dotLayer);

    const viewport = attachViewport(svg, wrap, () => {
      if (Array.isArray(view.viewBox) && view.viewBox.length === 4) return { x: view.viewBox[0], y: view.viewBox[1], w: view.viewBox[2], h: view.viewBox[3] };
      const all = [...view.nodes, ...(view.containers || [])];
      const x0 = Math.min(...all.map((n) => n.x)), y0 = Math.min(...all.map((n) => n.y));
      return { x: x0, y: y0, w: Math.max(...all.map((n) => n.x + n.w)) - x0, h: Math.max(...all.map((n) => n.y + n.h)) - y0 };
    });

    /* ---- adjacency and shortest path (edges are treated as undirected, direction is reported) ---- */
    const neighbours = (nodeId) => {
      const out = [];
      for (const e of edges) {
        if (e.from === nodeId) out.push({ node: e.to, edge: e, forward: true });
        else if (e.to === nodeId) out.push({ node: e.from, edge: e, forward: false });
      }
      return out;
    };
    function findPath(from, to) {
      if (!nodes.has(from) || !nodes.has(to)) return null;
      const prev = new Map([[from, null]]);
      const queue = [from];
      while (queue.length && !prev.has(to)) {
        const cur = queue.shift();
        for (const adj of neighbours(cur)) {
          if (prev.has(adj.node)) continue;
          prev.set(adj.node, { from: cur, edge: adj.edge, forward: adj.forward });
          queue.push(adj.node);
        }
      }
      if (!prev.has(to)) return null;
      const hops = [];
      for (let cur = to; prev.get(cur); cur = prev.get(cur).from) hops.unshift({ from: prev.get(cur).from, to: cur, edge: prev.get(cur).edge, forward: prev.get(cur).forward });
      return { nodes: [from, ...hops.map((h) => h.to)], hops };
    }

    /* ---- painting: one function derives every class from the current state ---- */
    const st = { selected: null, highlight: null, path: null, hidden: new Set() };
    function paint() {
      const sel = st.selected;
      const near = new Set(sel ? [sel, ...neighbours(sel).map((a) => a.node)] : []);
      const hl = st.highlight, pathState = st.path;
      for (const [nid, g] of nodeEls) {
        const hidden = st.hidden.has(nodes.get(nid).group);
        g.style.display = hidden ? 'none' : '';
        const onPath = pathState && pathState.nodes.includes(nid);
        const inHl = hl && hl.nodeIds.has(nid);
        let dim = false;
        if (pathState) dim = !onPath; else if (hl) dim = !inHl; else if (sel) dim = !near.has(nid);
        g.classList.toggle('sel', !pathState && !hl && nid === sel);
        g.classList.toggle('path', !!onPath);
        g.classList.toggle('hl', !!inHl && !pathState);
        g.classList.toggle('dim', dim);
      }
      for (const [eid, rec] of edgeEls) {
        const e = rec.edge;
        const hidden = st.hidden.has(nodes.get(e.from).group) || st.hidden.has(nodes.get(e.to).group);
        rec.g.style.display = hidden ? 'none' : '';
        const onPath = pathState && pathState.edgeIds.has(eid);
        const inHl = hl && hl.edgeIds.has(eid);
        const touchesSel = sel && (e.from === sel || e.to === sel);
        let dim = false, lit = false;
        if (pathState) { lit = onPath; dim = !onPath; } else if (hl) { lit = inHl; dim = !inHl; } else if (sel) { lit = touchesSel; dim = !touchesSel; }
        rec.g.classList.toggle('hl', lit && !pathState);
        rec.g.classList.toggle('path', !!lit && !!pathState);
        rec.g.classList.toggle('dim', dim);
        rec.path.setAttribute('marker-end', 'url(#' + (lit ? 'arrhl' : 'arr') + '-' + id + ')');
      }
    }

    function animate(edgeIds) {
      dotLayer.replaceChildren();
      if (REDUCED_MOTION) return; // the highlight alone carries the meaning
      for (const eid of edgeIds || []) {
        const rec = edgeEls.get(eid);
        if (!rec) continue;
        dotLayer.append(sv('circle', { class: 'dot', r: 4.5 },
          sv('animateMotion', { dur: '1.8s', repeatCount: 'indefinite', path: rec.d })));
      }
    }

    return {
      root: wrap, svg, viewport, findPath, neighbours, nodes, groups, edgeEls, nodeEls,
      setSelected(nodeId) { st.selected = nodeId; paint(); },
      setHighlight(h) { st.highlight = h ? { nodeIds: new Set(h.nodeIds || []), edgeIds: new Set(h.edgeIds || []) } : null; paint(); },
      setPath(p) { st.path = p ? { nodes: p.nodes, edgeIds: new Set(p.hops.map((x) => x.edge.id)) } : null; paint(); },
      toggleGroup(groupId) { if (st.hidden.has(groupId)) st.hidden.delete(groupId); else st.hidden.add(groupId); paint(); return !st.hidden.has(groupId); },
      isHidden: (groupId) => st.hidden.has(groupId),
      animate, fit: viewport.fit, paint
    };
  }

  /* ===================================================================
   * Shared detail-panel pieces
   * =================================================================== */
  const listOf = (items, mono) => (items && items.length ? el('ul', {}, items.map((x) => el('li', { class: mono ? 'mono' : '' }, x))) : null);
  const section = (title, body) => (body ? [el('h3', {}, title), body] : null);

  function copyLinkButton(viewId, itemId) {
    return el('button', { type: 'button', class: 'btn', 'data-act': 'copy-link', onclick: () => { setHash(viewId, itemId); copyText(location.href, tr('linkCopied')); } }, tr('copyLink'));
  }

  /* ===================================================================
   * View: map
   * =================================================================== */
  function renderMapView(view, root) {
    const detail = el('div', { class: 'card', 'aria-live': 'polite' });
    const traceBox = el('div', { class: 'trace' });
    const trace = { on: false, from: null, to: null };
    let selected = null;

    const widget = createMapWidget(view, { onNodeClick: (nid) => (trace.on ? traceClick(nid) : select(nid, { user: true })) });
    const traceBtn = el('button', { type: 'button', class: 'btn', 'aria-pressed': 'false', 'data-act': 'trace', onclick: () => setTrace(!trace.on) }, tr('trace'));
    const legend = (view.groups || []).map((g, i) => {
      const chip = el('button', { type: 'button', class: 'chip on', 'data-group': g.id, 'aria-pressed': 'true', onclick: () => {
        const visible = widget.toggleGroup(g.id);
        chip.classList.toggle('on', visible);
        chip.setAttribute('aria-pressed', String(visible));
        if (!visible && selected && widget.nodes.get(selected).group === g.id) select(null);
      } }, el('span', { class: 'swatch', style: 'background:' + (g.color || PALETTE[i % PALETTE.length]) }), g.label);
      return chip;
    });

    root.append(el('div', { class: 'split wide' },
      el('div', { class: 'card' },
        el('h2', {}, view.title), view.description ? el('p', { class: 'muted' }, view.description) : null,
        el('div', { class: 'row-tools' }, traceBtn, legend.length ? el('span', { class: 'muted' }, tr('legend') + ':') : null, legend),
        widget.root, el('p', { class: 'hint' }, tr('mapHint')), traceBox),
      detail));

    function setTrace(on) {
      trace.on = on; trace.from = null; trace.to = null;
      traceBtn.setAttribute('aria-pressed', String(on));
      traceBtn.textContent = on ? tr('traceStop') : tr('trace');
      widget.setPath(null);
      drawTrace();
    }
    function traceClick(nid) {
      if (!trace.from || trace.to) { trace.from = nid; trace.to = null; widget.setPath(null); }
      else trace.to = nid;
      if (trace.to) widget.setPath(widget.findPath(trace.from, trace.to));
      drawTrace();
    }
    function drawTrace() {
      traceBox.replaceChildren();
      if (!trace.on) return;
      if (!trace.from) return traceBox.append(el('p', { class: 'callout', 'data-trace': 'pick-from' }, tr('tracePickFrom')));
      if (!trace.to) return traceBox.append(el('p', { class: 'callout', 'data-trace': 'pick-to' }, tr('tracePickTo')));
      const path = widget.findPath(trace.from, trace.to);
      if (!path) return traceBox.append(el('p', { class: 'callout', 'data-trace': 'none' }, tr('traceNoPath')));
      const title = (nid) => widget.nodes.get(nid).title;
      traceBox.append(el('div', { class: 'callout', 'data-trace': 'result' },
        el('b', {}, tr('traceHops', { n: path.hops.length })),
        el('ol', {}, el('li', {}, title(path.nodes[0])),
          path.hops.map((h) => el('li', {}, (h.forward ? '→ ' : '← ') + title(h.to) + (h.edge.label ? '  (' + h.edge.label + ')' : '')))),
        el('button', { type: 'button', class: 'btn', onclick: () => setTrace(true) }, tr('traceClear'))));
    }

    function drawDetail(nid) {
      detail.replaceChildren();
      if (!nid) return put(detail, el('h2', {}, tr('detail')), el('p', { class: 'muted' }, tr('pickItem')));
      const n = widget.nodes.get(nid);
      const g = widget.groups.get(n.group);
      const conns = widget.neighbours(nid);
      put(detail, 
        el('h2', {}, n.title, ' ', g ? el('span', { class: 'chip' }, g.label) : null, n.external ? el('span', { class: 'chip unverified' }, tr('external')) : null),
        n.sub ? el('p', { class: 'muted' }, n.sub) : null,
        n.summary ? el('p', {}, n.summary) : null,
        section(tr('size'), n.size ? el('p', {}, n.size) : null),
        section(tr('files'), listOf(n.files, true)),
        section(tr('notes'), listOf(n.notes)),
        (n.extra || []).map((x) => [el('h3', {}, x.label), el('p', {}, x.text)]),
        section(tr('connections'), conns.length ? el('ul', {}, conns.map((a) => el('li', {},
          el('button', { type: 'button', class: 'chip link', onclick: () => select(a.node, { user: true }) }, (a.forward ? '→ ' : '← ') + widget.nodes.get(a.node).title),
          a.edge.label ? el('span', { class: 'muted' }, ' ' + a.edge.label) : null))) : null),
        linkChips(n.links), el('p', {}, copyLinkButton(view.id, nid)));
    }

    function select(nid, opts) {
      selected = nid;
      widget.setSelected(nid);
      drawDetail(nid);
      // The default selection at boot must not rewrite the URL: it would clobber an incoming deep link.
      if (nid && !(opts && opts.silent)) setHash(view.id, nid);
    }
    select(null, { silent: true });

    return {
      onShow: widget.fit,
      select: (nid) => { if (widget.nodes.has(nid)) { if (trace.on) setTrace(false); select(nid); } },
      widget, setTrace, traceClick
    };
  }

  /* ===================================================================
   * View: flow
   * =================================================================== */
  function renderFlowView(view, root) {
    const steps = view.steps;
    const mapView = view.mapView ? viewById.get(view.mapView) : null;
    let idx = 0, timer = 0, speed = 1;
    const widget = mapView ? createMapWidget(mapView, { compact: true, onNodeClick: (nid) => navigate(mapView.id, nid) }) : null;

    const lanes = (view.lanes || []).map((l, i) => el('div', { class: 'lane', 'data-lane': l.id, style: 'border-color:' + (l.color || PALETTE[i % PALETTE.length]) },
      el('b', {}, l.name || l.id), l.sub ? el('span', { class: 'muted' }, l.sub) : null));
    const chips = steps.map((s, i) => el('button', { type: 'button', 'data-i': i, 'aria-label': s.title, title: s.title, onclick: () => go(i) }, String(i + 1)));
    const counter = el('span', { class: 'muted', 'data-role': 'counter' });
    const playBtn = el('button', { type: 'button', class: 'btn', 'data-act': 'play', 'aria-pressed': 'false', onclick: () => (timer ? pause() : play()) }, tr('play'));
    const speedSel = el('select', { 'aria-label': tr('speed'), onchange: (e) => { speed = Number(e.target.value); if (timer) { pause(); play(); } } },
      [0.5, 1, 2].map((v) => el('option', { value: v, selected: v === 1 }, v + 'x')));
    const body = el('div', { class: 'flashable' });

    const left = el('div', { class: 'card' },
      el('h2', {}, view.title), view.description ? el('p', { class: 'muted' }, view.description) : null,
      lanes.length ? el('div', { class: 'lanes' }, lanes) : null,
      el('div', { class: 'row-tools flowctl' },
        el('button', { type: 'button', class: 'btn', 'data-act': 'prev', onclick: () => go(idx - 1) }, tr('prev')),
        playBtn,
        el('button', { type: 'button', class: 'btn', 'data-act': 'next', onclick: () => go(idx + 1) }, tr('next')),
        el('label', { class: 'muted' }, tr('speed') + ' ', speedSel), counter),
      el('div', { class: 'stepbar' }, chips), body);
    root.append(widget ? el('div', { class: 'split mapright' }, left, el('div', { class: 'card' }, widget.root)) : left);

    function go(i, opts) {
      idx = clamp(i, 0, steps.length - 1);
      const s = steps[idx];
      chips.forEach((c, k) => c.classList.toggle('on', k === idx));
      $$('.lane', left).forEach((l) => l.classList.toggle('on', (s.actors || []).includes(l.dataset.lane)));
      counter.textContent = tr('stepOf', { i: idx + 1, n: steps.length });
      body.dataset.key = keyOf(view.id, s.id);
      fill(body,
        el('h3', { 'data-role': 'step-title' }, (idx + 1) + '. ' + s.title),
        s.status ? el('p', {}, tr('status') + ': ', el('span', { class: 'chip on' }, s.status)) : null,
        el('p', {}, s.text),
        section(tr('refs'), listOf(s.refs, true)),
        linkChips(s.links));
      if (widget) {
        const hasHighlight = (s.edgeIds && s.edgeIds.length) || (s.nodeIds && s.nodeIds.length);
        widget.setHighlight(hasHighlight ? { nodeIds: s.nodeIds, edgeIds: s.edgeIds } : null);
        widget.animate(s.edgeIds);
      }
      if (!(opts && opts.quiet)) setHash(view.id, s.id);
    }
    function play() {
      if (idx >= steps.length - 1) go(0);
      playBtn.setAttribute('aria-pressed', 'true');
      playBtn.textContent = tr('pause');
      timer = setInterval(() => { if (idx >= steps.length - 1) pause(); else go(idx + 1); }, 3500 / speed);
    }
    function pause() {
      clearInterval(timer);
      timer = 0;
      playBtn.setAttribute('aria-pressed', 'false');
      playBtn.textContent = tr('play');
    }
    go(0, { quiet: true });

    return {
      onShow() { if (widget) widget.fit(); },
      select(stepId) { const i = steps.findIndex((s) => s.id === stepId); if (i >= 0) { pause(); go(i); } },
      step: (d) => go(idx + d), go, play, pause, isPlaying: () => !!timer, current: () => idx, widget
    };
  }

  /* ===================================================================
   * View: states (layered SVG graph + simulator)
   * =================================================================== */
  const NODE_H = 34, V_GAP = 56, H_GAP = 26;

  /** Assigns every state a layer (BFS depth from the initial states) and an order inside the layer. */
  function layoutStates(view) {
    const ids = view.states.map((s) => s.id);
    const forward = new Map(ids.map((i) => [i, []]));
    const hasIncoming = new Set();
    for (const t of view.transitions || []) {
      if (t.from && t.from !== '*' && forward.has(t.from) && t.from !== t.to) { forward.get(t.from).push(t.to); hasIncoming.add(t.to); }
    }
    let roots = view.states.filter((s) => s.initial).map((s) => s.id);
    if (!roots.length) roots = ids.filter((i) => !hasIncoming.has(i));
    if (!roots.length && ids.length) roots = [ids[0]];

    const layer = new Map(roots.map((r) => [r, 0]));
    const queue = [...roots];
    while (queue.length) {
      const cur = queue.shift();
      for (const nxt of forward.get(cur)) {
        if (!layer.has(nxt)) { layer.set(nxt, layer.get(cur) + 1); queue.push(nxt); }
      }
    }
    // Unreachable states (or ones only reached through the wildcard) get their own last layer.
    const extra = Math.max(-1, ...layer.values()) + 1;
    for (const i of ids) if (!layer.has(i)) layer.set(i, extra);

    const rows = [];
    for (const i of ids) (rows[layer.get(i)] = rows[layer.get(i)] || []).push(i);
    const dense = rows.map((r) => r || []);
    // Two barycenter sweeps pull each state under its parents, which removes most crossings.
    const pos = new Map();
    const index = () => dense.forEach((r) => r.forEach((id, k) => pos.set(id, k)));
    index();
    for (let pass = 0; pass < 2; pass++) {
      for (let l = 1; l < dense.length; l++) {
        const bary = (id) => {
          const parents = ids.filter((p) => layer.get(p) === l - 1 && forward.get(p).includes(id));
          return parents.length ? parents.reduce((a, p) => a + pos.get(p), 0) / parents.length : pos.get(id);
        };
        dense[l].sort((a, b) => bary(a) - bary(b));
        index();
      }
    }
    return { layer, rows: dense };
  }

  function renderStatesView(view, root) {
    const families = view.families || [];
    const stateById = new Map(view.states.map((s) => [s.id, s]));
    const transitions = (view.transitions || []).map((t, i) => Object.assign({ i }, t));
    const maxLabel = Math.max(...view.states.map((s) => (s.label || s.id).length));
    const nodeW = clamp(maxLabel * 6.9 + 30, 120, 280);
    const { layer, rows } = layoutStates(view);
    const widest = Math.max(...rows.map((r) => r.length), 1);
    const totalW = widest * nodeW + (widest - 1) * H_GAP;
    const box = new Map();
    rows.forEach((r, l) => {
      const rowW = r.length * nodeW + (r.length - 1) * H_GAP;
      r.forEach((id, k) => box.set(id, { x: 30 + (totalW - rowW) / 2 + k * (nodeW + H_GAP), y: 30 + l * (NODE_H + V_GAP), w: nodeW, h: NODE_H }));
    });
    const bounds = { x: 0, y: 0, w: totalW + 60, h: rows.length * (NODE_H + V_GAP) + 20 };

    const svg = sv('svg', { 'aria-label': view.title, preserveAspectRatio: 'xMidYMid meet', viewBox: '0 0 100 100' });
    const wrap = el('div', { class: 'viewport tall' }, svg);
    const tooltip = makeTooltip(wrap);
    const mk = (name, color) => sv('marker', { id: name + '-' + view.id, viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto' }, sv('path', { d: 'M0,0 L10,5 L0,10 z', fill: color }));
    svg.append(sv('defs', {}, mk('sarr', 'var(--muted)'), mk('sarrhl', 'var(--accent)'), mk('sarrtrail', 'var(--ok)')));
    const viewport = attachViewport(svg, wrap, () => bounds);

    // One curve per transition between two concrete states. `*` and entry transitions are shown as badges instead.
    const pairCount = new Map();
    const trEls = [];
    const edgeLayer = sv('g', {});
    for (const t of transitions) {
      if (!t.from || t.from === '*' || t.from === t.to) continue;
      const a = box.get(t.from), b = box.get(t.to);
      const k = t.from + '>' + t.to;
      const n = pairCount.get(k) || 0;
      pairCount.set(k, n + 1);
      let d;
      if (layer.get(t.to) > layer.get(t.from)) {
        const sx = a.x + a.w / 2 + n * 16, sy = a.y + a.h, tx = b.x + b.w / 2 + n * 16, ty = b.y, dy = Math.max(18, (ty - sy) / 2);
        d = 'M' + sx + ',' + sy + ' C' + sx + ',' + (sy + dy) + ' ' + tx + ',' + (ty - dy) + ' ' + tx + ',' + ty;
      } else if (layer.get(t.to) === layer.get(t.from)) {
        const sx = a.x + a.w / 2, tx = b.x + b.w / 2, top = a.y - 26 - n * 8;
        d = 'M' + sx + ',' + a.y + ' C' + sx + ',' + top + ' ' + tx + ',' + top + ' ' + tx + ',' + (b.y - 2);
      } else {
        const bulge = 50 + n * 14 + Math.abs(layer.get(t.from) - layer.get(t.to)) * 6;
        const sx = a.x + a.w, sy = a.y + a.h / 2, tx = b.x + b.w, ty = b.y + b.h / 2;
        d = 'M' + sx + ',' + sy + ' C' + (sx + bulge) + ',' + sy + ' ' + (tx + bulge) + ',' + ty + ' ' + (tx + 2) + ',' + ty;
      }
      const label = t.from + ' → ' + t.to + ': ' + t.by;
      const path = sv('path', { class: 'tr', d, 'marker-end': 'url(#sarr-' + view.id + ')', 'data-from': t.from, 'data-to': t.to }, sv('title', {}, label));
      path.addEventListener('pointerenter', (ev) => tooltip.show(label, ev));
      path.addEventListener('pointerleave', () => tooltip.hide());
      edgeLayer.append(path);
      trEls.push({ t, path });
    }
    svg.append(edgeLayer);

    const stEls = new Map();
    const nodeLayer = sv('g', {});
    for (const s of view.states) {
      const b = box.get(s.id);
      const anyIn = transitions.some((t) => t.from === '*' && t.to === s.id);
      const entryIn = transitions.some((t) => (t.from === null || t.from === undefined) && t.to === s.id);
      const g = sv('g', { class: cls('st', s.initial && 'initial', s.terminal && 'terminal'), 'data-id': s.id, 'data-key': keyOf(view.id, s.id), tabindex: 0, role: 'button', 'aria-label': s.label || s.id },
        sv('title', {}, (s.label || s.id) + (s.description ? ' — ' + s.description : '')),
        sv('rect', { x: b.x, y: b.y, width: b.w, height: b.h, rx: 8 }),
        sv('text', { x: b.x + 10, y: b.y + b.h / 2 + 4 }, s.label || s.id),
        anyIn ? sv('text', { class: 'badge', x: b.x + b.w - 8, y: b.y + 12, 'text-anchor': 'end' }, '*') : null,
        entryIn ? sv('text', { class: 'badge', x: b.x + 8, y: b.y - 4 }, '▶') : null);
      g.addEventListener('click', () => { if (!viewport.isDragging()) select(s.id); });
      g.addEventListener('keydown', (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); select(s.id); } });
      nodeLayer.append(g);
      stEls.set(s.id, g);
    }
    svg.append(nodeLayer);

    /* ---- state: family filter, selection, simulator ---- */
    const st = { family: null, selected: null, sim: { start: null, cur: null, trail: [] } };
    const matches = (t) => !st.family || !(t.families && t.families.length) || t.families.includes(st.family);
    const detail = el('div', { class: 'card', 'aria-live': 'polite' });
    const simBox = el('div', { class: 'card' });

    function paint() {
      const touched = new Set();
      transitions.filter(matches).forEach((t) => { if (t.from) touched.add(t.from); touched.add(t.to); });
      const trailEdges = new Set();
      const trail = st.sim.trail;
      for (let k = 1; k < trail.length; k++) trailEdges.add(trail[k - 1].state + '>' + trail[k].state);
      for (const { t, path } of trEls) {
        const lit = st.selected && (t.from === st.selected || t.to === st.selected);
        const onTrail = trailEdges.has(t.from + '>' + t.to);
        path.classList.toggle('hl', !!lit && !onTrail);
        path.classList.toggle('trail', onTrail);
        path.classList.toggle('dim', !matches(t) || (!!st.selected && !lit && !onTrail));
        path.setAttribute('marker-end', 'url(#' + (onTrail ? 'sarrtrail' : lit ? 'sarrhl' : 'sarr') + '-' + view.id + ')');
      }
      for (const [sid, g] of stEls) {
        g.classList.toggle('sel', sid === st.selected);
        g.classList.toggle('cur', sid === st.sim.cur);
        g.classList.toggle('dim', !!st.family && !touched.has(sid));
      }
    }

    function drawDetail() {
      detail.replaceChildren();
      const sid = st.selected;
      if (!sid) return put(detail, el('h2', {}, tr('detail')), el('p', { class: 'muted' }, tr('pickItem')));
      const s = stateById.get(sid);
      const incoming = transitions.filter((t) => t.to === sid && matches(t));
      const outgoing = transitions.filter((t) => (t.from === sid || t.from === '*') && matches(t));
      const stateLink = (id) => (stateById.has(id)
        ? el('button', { type: 'button', class: 'chip link', onclick: () => select(id) }, id)
        : el('span', { class: 'chip' }, id === '*' ? tr('fromAny') : id === null ? tr('entry') : String(id)));
      const rowsOf = (list, dir) => (list.length ? el('ul', {}, list.map((t) => el('li', {},
        dir === 'in' ? stateLink(t.from === undefined ? null : t.from) : stateLink(t.to), ' ',
        el('span', { class: 'muted' }, tr('via') + ' '), t.by,
        (t.families || []).map((f) => el('span', { class: 'chip' }, f)),
        t.note ? el('div', { class: 'muted' }, t.note) : null))) : el('p', { class: 'muted' }, tr('none')));
      put(detail, el('h2', {}, s.label || s.id),
        s.initial ? el('span', { class: 'chip on' }, tr('initialState')) : null, s.terminal ? el('span', { class: 'chip' }, tr('terminalState')) : null,
        s.group ? el('span', { class: 'chip' }, s.group) : null,
        s.description ? el('p', {}, s.description) : null,
        el('h3', {}, tr('enteredFrom')), rowsOf(incoming, 'in'),
        el('h3', {}, tr('leavesTo')), rowsOf(outgoing, 'out'),
        linkChips(s.links), el('p', {}, copyLinkButton(view.id, sid)));
    }

    /* Simulator: walk the machine by choosing among the transitions allowed from the current state. */
    function allowedFrom(cur) { return transitions.filter((t) => t.from && (t.from === cur || t.from === '*') && matches(t)); }
    function simReset(start) {
      st.sim.start = start;
      st.sim.cur = start;
      st.sim.trail = [{ state: start, by: null }];
      drawSim();
      paint();
    }
    function simTake(t) {
      st.sim.cur = t.to;
      st.sim.trail.push({ state: t.to, by: t.by });
      drawSim();
      paint();
    }
    function drawSim() {
      const startSel = el('select', { 'aria-label': tr('simStart'), 'data-role': 'sim-start', onchange: (e) => simReset(e.target.value) },
        view.states.map((s) => el('option', { value: s.id, selected: s.id === st.sim.start }, s.label || s.id)));
      const next = allowedFrom(st.sim.cur);
      fill(simBox, el('h2', {}, tr('simulator')),
        el('div', { class: 'row-tools' }, el('label', {}, tr('simStart') + ' ', startSel),
          el('button', { type: 'button', class: 'btn', 'data-act': 'sim-reset', onclick: () => simReset(st.sim.start) }, tr('simReset'))),
        el('p', {}, tr('simCurrent') + ': ', el('span', { class: 'chip on', 'data-role': 'sim-current' }, st.sim.cur)),
        el('h3', {}, tr('simNext')),
        next.length ? el('div', { 'data-role': 'sim-next' }, next.map((t) => el('button', { type: 'button', class: 'chip link', 'data-act': 'sim-take', onclick: () => simTake(t) }, '→ ' + t.to + ' · ' + t.by)))
          : el('p', { class: 'muted' }, tr('simNone')),
        el('h3', {}, tr('simHistory')),
        el('p', { 'data-role': 'sim-trail' }, st.sim.trail.map((h, i) => [i ? el('span', { class: 'muted' }, ' → ') : null, el('span', { class: 'chip', title: h.by || '' }, h.state)])));
    }

    function select(sid) {
      st.selected = sid;
      drawDetail();
      paint();
      if (sid) setHash(view.id, sid);
    }
    function setFamily(f) {
      st.family = f;
      $$('.fam', root).forEach((c) => c.classList.toggle('on', c.dataset.family === (f || '')));
      drawDetail();
      drawSim();
      paint();
    }

    const famChips = families.length ? [
      el('button', { type: 'button', class: 'chip btn fam on', 'data-family': '', onclick: () => setFamily(null) }, tr('all')),
      ...families.map((f) => el('button', { type: 'button', class: 'chip fam', 'data-family': f, onclick: () => setFamily(f) }, f))
    ] : [];

    root.append(el('div', { class: 'split wide' },
      el('div', { class: 'card' }, el('h2', {}, view.title), view.description ? el('p', { class: 'muted' }, view.description) : null,
        famChips.length ? el('div', { class: 'row-tools' }, el('span', { class: 'muted' }, tr('family') + ':'), famChips) : null,
        wrap, el('p', { class: 'hint' }, tr('mapHint'))),
      el('div', {}, detail, el('div', { style: 'height:14px' }), simBox)));

    const first = (view.states.find((s) => s.initial) || view.states[0]).id;
    simReset(first);
    drawDetail();
    paint();

    return {
      onShow: viewport.fit,
      select: (sid) => { if (stateById.has(sid)) select(sid); },
      setFamily, simReset, simTake, allowedFrom, layout: { layer, rows }, state: st
    };
  }

  /* ===================================================================
   * View: catalog (sortable, filterable, groupable table)
   * =================================================================== */
  function renderCatalogView(view, root) {
    const cols = view.columns;
    const rows = view.rows.map((r, i) => ({ id: rowId(r, i), data: r }));
    const st = { q: '', filters: new Map(), sortKey: null, dir: 1, selected: null, collapsed: new Set() };
    const detail = el('div', { class: 'card', 'aria-live': 'polite' });
    const countEl = el('p', { class: 'hint', 'data-role': 'count' });
    const tbody = el('tbody');
    const headRow = el('tr');
    const text = (r) => cols.map((c) => String(r.data[c.key] ?? '')).join(' · ');

    cols.forEach((c) => headRow.append(el('th', { scope: 'col', 'data-col': c.key }, el('button', { type: 'button', 'data-act': 'sort', onclick: () => sortBy(c.key) }, c.label, ' ', el('span', { class: 'arrow' })))));

    const chipsBox = el('div', { class: 'row-tools' });
    for (const c of cols.filter((x) => x.filterable)) {
      const values = [...new Set(rows.map((r) => String(r.data[c.key] ?? '')).filter(Boolean))].sort();
      put(chipsBox, el('span', { class: 'muted' }, c.label + ':'), values.map((v) => el('button', { type: 'button', class: 'chip', 'data-col': c.key, 'data-value': v, onclick: () => {
        if (st.filters.get(c.key) === v) st.filters.delete(c.key); else st.filters.set(c.key, v);
        draw();
      } }, v)));
    }
    const search = el('input', { type: 'search', class: 'grow', placeholder: tr('filterRows'), 'aria-label': tr('filterRows'), oninput: (e) => { st.q = e.target.value.toLowerCase(); draw(); } });

    root.append(el('div', { class: 'split wide' },

  /* ===================================================================

  /* ===================================================================
   * Command palette
   * =================================================================== */
  const pal = { open: false, results: [], active: 0, returnFocus: null };
  const palInput = el('input', { type: 'search', 'aria-label': tr('search'), placeholder: tr('searchPlaceholder'), autocomplete: 'off', oninput: () => palSearch() });
  const palList = el('ul', { role: 'listbox', 'aria-label': tr('search') });
  const palEl = el('div', { class: 'overlay', hidden: true, role: 'dialog', 'aria-modal': 'true', 'aria-label': tr('search'),
    onclick: (e) => { if (e.target === palEl) closePalette(); } }, el('div', { class: 'pal' }, palInput, palList));

  function isSubsequence(needle, hay) {
    let i = 0;

  }
  function score(entry, tokens) {
    const label = entry.label.toLowerCase(), text = entry.text.toLowerCase();
    let total = 0;
    for (const tok of tokens) {
      if (label.startsWith(tok)) total += 100;
      else if (label.includes(tok)) total += 70;
      else if (text.includes(tok)) total += 40;
      else if (isSubsequence(tok, label)) total += 15;

    }
    return total;
  }
  function palSearch() {
    const tokens = palInput.value.toLowerCase().split(/\s+/).filter(Boolean);
    pal.results = tokens.length
      ? INDEX.map((e) => ({ e, s: score(e, tokens) })).filter((x) => x.s > 0).sort((a, b) => b.s - a.s).slice(0, 30).map((x) => x.e)

        el('span', {}, e.label), el('span', { class: 'kind' }, e.kind)))

  /* ===================================================================

  /* ===================================================================
   * Self-test (?selftest=1): drives every view through its public controls, reports PASS/FAIL
   * =================================================================== */
  function selfTest() {
    const failures = [];
    const uncaught = [];
    window.addEventListener('error', (e) => uncaught.push(e.message));
    const check = (cond, message) => { if (!cond) failures.push(message); };
    const attempt = (name, fn) => { try { fn(); } catch (e) { failures.push(name + ' threw: ' + (e && e.message ? e.message : e)); } };
    const click = (node) => node.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true }));
    const typeInto = (input, value) => { input.value = value; input.dispatchEvent(new Event('input', { bubbles: true })); };
    const active = (id) => sections.get(id);
    // Rendering bugs such as arrays printed as [object ...] only show up in the text, so every interaction is followed by this check.
    const BAD_TEXT = /\[object |\bundefined\b|\bNaN\b/;
    const sane = (node, where) => check(!BAD_TEXT.test(node.textContent), where + ': page text contains ' + ((node.textContent.match(BAD_TEXT) || [''])[0]));

    for (const view of DATA.views) {
      attempt('open view ' + view.id, () => {
        navigate(view.id);
        check(active(view.id).classList.contains('active'), view.id + ': section not active');
        check(active(view.id).children.length > 0, view.id + ': section is empty');
        sane(active(view.id), view.id);
        check(tabButtons.get(view.id).getAttribute('aria-selected') === 'true', view.id + ': tab not selected');
      });
    }

    for (const view of DATA.views.filter((v) => v.type === 'map')) {
      const ctl = controllers.get(view.id), sec = active(view.id);
      attempt('map select ' + view.id, () => {
        navigate(view.id);
        for (const n of view.nodes) {
          click(ctl.widget.nodeEls.get(n.id));
          check($$('.node.sel', sec).length === 1, view.id + '/' + n.id + ': expected exactly one selected node');
          check($('h2', $$('.card', sec).pop()).textContent.includes(n.title), view.id + '/' + n.id + ': detail title mismatch');
          sane(sec, view.id + '/' + n.id);
        }
      });
      attempt('map trace ' + view.id, () => {
        if (!view.edges || !view.edges.length) return;
        click($('[data-act="trace"]', sec));
        check(ctl.widget.root && $('[data-trace="pick-from"]', sec), view.id + ': trace prompt missing');
        const e = view.edges[0];
        click(ctl.widget.nodeEls.get(e.from));
        click(ctl.widget.nodeEls.get(e.to));
        const result = $('[data-trace="result"]', sec);
        check(result && $$('li', result).length >= 2, view.id + ': trace result missing or too short');
        check($$('.node.path', sec).length >= 2, view.id + ': path nodes not highlighted');
        click($('[data-act="trace"]', sec));
        check($$('.node.path', sec).length === 0, view.id + ': path not cleared when tracing stops');
      });
      attempt('map groups ' + view.id, () => {
        const chip = $('button[data-group]', sec);
        if (!chip) return;
        const first = view.nodes.find((n) => n.group === chip.dataset.group);
        click(chip);
        check(first && ctl.widget.nodeEls.get(first.id).style.display === 'none', view.id + ': group not hidden');
        click(chip);
        check(first && ctl.widget.nodeEls.get(first.id).style.display === '', view.id + ': group not shown again');
      });
      attempt('map zoom ' + view.id, () => {
        const before = ctl.widget.viewport.viewBox();
        click($('[data-act="zoom-in"]', sec));
        click($('[data-act="fit"]', sec));
        check(typeof ctl.widget.viewport.viewBox() === 'string', view.id + ': viewBox missing');
        check(before !== null, view.id + ': viewBox was never set');
      });
    }

    for (const view of DATA.views.filter((v) => v.type === 'flow')) {
      const ctl = controllers.get(view.id), sec = active(view.id);
      attempt('flow ' + view.id, () => {
        navigate(view.id);
        view.steps.forEach((s, i) => {
          click($$('.stepbar button', sec)[i]);

          if (ctl.widget) {
            const lit = new Set(s.edgeIds || []);
            check($$('.edge-g.hl', ctl.widget.root).length === lit.size, view.id + '/' + s.id + ': highlighted edge count differs from edgeIds');
          }
        });
        click($('[data-act="prev"]', sec));
        click($('[data-act="next"]', sec));
        click($('[data-act="play"]', sec));
        check(ctl.isPlaying(), view.id + ': autoplay did not start');
        click($('[data-act="play"]', sec));
        check(!ctl.isPlaying(), view.id + ': autoplay did not stop');
      });
    }

    for (const view of DATA.views.filter((v) => v.type === 'states')) {
      const ctl = controllers.get(view.id), sec = active(view.id);
      attempt('states ' + view.id, () => {
        navigate(view.id);
        check(ctl.layout.layer.size === view.states.length, view.id + ': layout missed some states');
        for (const s of view.states) {
          click($('.st[data-id="' + s.id.replace(/"/g, '\\"') + '"]', sec));
          check($$('.st.sel', sec).length === 1, view.id + '/' + s.id + ': expected one selected state');
          sane(sec, view.id + '/' + s.id);
        }
        for (const chip of $$('.fam', sec)) click(chip);
        if ($('.fam', sec)) click($('.fam', sec)); // back to "all"
        click($('[data-act="sim-reset"]', sec));
        const start = $('[data-role="sim-current"]', sec).textContent;
        const next = $('[data-act="sim-take"]', sec);
        if (next) {
          click(next);
          check($$('[data-role="sim-trail"] .chip', sec).length === 2, view.id + ': simulator trail did not grow');
          sane(sec, view.id + ' simulator');
          click($('[data-act="sim-reset"]', sec));
          check($('[data-role="sim-current"]', sec).textContent === start, view.id + ': simulator reset failed');
        }
      });
    }

    for (const view of DATA.views.filter((v) => v.type === 'catalog')) {
      const ctl = controllers.get(view.id), sec = active(view.id);
      attempt('catalog ' + view.id, () => {
        navigate(view.id);
        const total = view.rows.length;
        const sortBtn = $('[data-act="sort"]', sec);
        click(sortBtn);
        check($('th[aria-sort="ascending"]', sec), view.id + ': ascending sort not applied');
        click(sortBtn);
        check($('th[aria-sort="descending"]', sec), view.id + ': descending sort not applied');
        click(sortBtn);
        const probe = String(view.rows[0][view.columns[0].key]).slice(0, 4).toLowerCase();
        typeInto(ctl.search, probe);
        const filtered = ctl.visibleRows().length;
        check(filtered >= 1 && filtered <= total, view.id + ': search returned an impossible count');
        typeInto(ctl.search, '');
        const chip = $('button.chip[data-col]', sec);
        if (chip) {
          click(chip);
          check(ctl.visibleRows().length <= total && chip.classList.contains('on'), view.id + ': filter chip did not apply');
          click(chip);
        }
        const row = $('tbody tr[data-key]', sec);
        click(row);
        check($('[data-act="copy-row"]', sec), view.id + ': row detail missing');
        sane(sec, view.id + ' catalog');
      });
    }

    for (const view of DATA.views.filter((v) => v.type === 'metrics')) {
      const sec = active(view.id);
      attempt('metrics ' + view.id, () => {
        navigate(view.id);
        check($$('.barrow', sec).length >= 1, view.id + ': no bars rendered');
        click($('[data-act="scale"]', sec));
        click($('[data-act="sort"]', sec));
        check($$('.barrow', sec).length >= 1, view.id + ': bars vanished after toggles');
        sane(sec, view.id);
      });
    }

    for (const view of DATA.views.filter((v) => v.type === 'notes')) {
      const sec = active(view.id);
      attempt('notes ' + view.id, () => {
        navigate(view.id);
        click($('[data-act="expand"]', sec));
        check($$('details[open]', sec).length === $$('details', sec).length, view.id + ': expand all failed');
        sane(sec, view.id + ' notes');
        click($('[data-act="collapse"]', sec));
        check($$('details[open]', sec).length === 0, view.id + ': collapse all failed');
        const chip = $('button.chip[data-kind][data-value]:not([data-value=""])', sec);
        if (chip) { click(chip); check($$('details', sec).length >= 1, view.id + ': filter hid every note'); }
        const all = $('button.chip[data-value=""]', sec);
        if (all) click(all);
      });
    }

    attempt('palette', () => {
      const entry = INDEX[0];
      openPalette();
      check(!palEl.hidden, 'palette did not open');
      typeInto(palInput, entry.label);
      check(pal.results.length >= 1 && pal.results[0].label.length > 0, 'palette returned no results for an indexed label');
      palInput.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowDown', bubbles: true }));
      palInput.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowUp', bubbles: true }));
      const target = pal.results[0];
      palInput.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
      check(palEl.hidden, 'palette did not close on Enter');
      check(currentView === target.view, 'palette Enter did not navigate to the result view');
    });

    attempt('deep links', () => {
      const sample = INDEX.filter((e, i) => i % Math.max(1, Math.floor(INDEX.length / 12)) === 0).slice(0, 12);
      for (const e of sample) {
        history.replaceState(null, '', hashFor(e.view, e.id));
        applyHash();
        check(currentView === e.view, 'deep link ' + e.key + ' opened the wrong view');
        check($$('[data-key]').some((n) => n.dataset.key === e.key), 'deep link ' + e.key + ' has no element in the page');
      }
    });

    check(uncaught.length === 0, 'uncaught errors: ' + uncaught.join('; '));
    const result = failures.length ? 'FAIL: ' + failures.join(' | ') : 'PASS';
    $('#selftest-result').textContent = result;
    document.title = 'selftest:' + (failures.length ? 'FAIL' : 'PASS');
    history.replaceState(null, '', location.pathname + location.search);
    return result;
  }

  // The only global: a namespace for debugging and the self-test.
  window.Explorer = { data: DATA, navigate, applyHash, openPalette, closePalette, selfTest };

  try {
    boot();
    if (/(^|[?&])selftest=1(&|$)/.test(location.search)) selfTest();
  } catch (err) {
    document.title = 'selftest:FAIL';
    $('#selftest-result').textContent = 'FAIL: boot error: ' + (err && err.stack ? err.stack : err);
    throw err;
  }
})();
</script>
</body>
</html>
